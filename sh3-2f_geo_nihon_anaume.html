<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">

<style>
:root{--bg:#fafaf8;--card:#fff;--tx:#222;--mu:#777;--bd:#ddd;--ac:#e8590c;--hd:#fbe3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--card:#262625;--tx:#eee;--mu:#9a9a95;--bd:#444;--ac:#ff922b;--hd:#4a2a30}}
:root[data-theme="dark"]{--bg:#1b1b1a;--card:#262625;--tx:#eee;--mu:#9a9a95;--bd:#444;--ac:#ff922b;--hd:#4a2a30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.9;font-size:14px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);padding:8px 14px;z-index:5}
h1{font-size:16px;margin:0 0 5px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer}
#prog{font-size:12px;color:var(--mu);margin-left:auto}
main{max-width:860px;margin:0 auto;padding:6px 14px 40px}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:12px 0;overflow:hidden}
h2{font-size:15px;margin:0;padding:6px 12px;background:var(--hd)}
h2 small{font-weight:400;color:var(--mu);margin-left:8px;font-size:11px}
.nt{font-size:12px;color:var(--mu);padding:4px 12px 0}
.row{display:flex;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.l{flex:0 0 25%;max-width:150px;padding:4px 10px;background:var(--hd);font-weight:600;font-size:13px}
.r{flex:1;padding:4px 10px}
.b{display:inline-block;min-width:3.6em;text-align:center;border-bottom:2px solid var(--ac);cursor:pointer;color:transparent;user-select:none;margin:0 2px;position:relative}
.b::before{content:attr(data-n);position:absolute;left:0;top:-6px;font-size:9px;color:var(--mu);line-height:1}
.b.s{color:var(--ac);font-weight:700}
.note{font-size:12px;color:var(--mu);margin:8px 0}
@media(max-width:520px){.l{flex-basis:30%}}
.fig{padding:6px 12px;text-align:center;border-top:1px solid var(--bd)}.fig svg{max-width:100%;height:auto}.sv{cursor:pointer}.sv text{fill:transparent;font-size:11px;text-anchor:middle}.sv.s text{fill:var(--ac);font-weight:700}.sv line{stroke:var(--ac);stroke-width:1.5}.cap{font-size:11px;color:var(--mu)}
</style></head><body>

function fill(s,c){return esc(s).replace(/\{([^}]*)\}/g,(m,a)=>{c.n++;return '<span class="b" data-n="'+c.n+'" data-a="'+a+'">'+a+'</span>'})}

 let h='<h2>'+s.t+'<small>'+s.p+'</small></h2>'+(s.n?'<div class="nt">'+esc(s.n)+'</div>':'');
 s.rows.forEach(r=>{h+='<div class="row"><div class="l">'+fill(r[0],c)+'</div><div class="r">'+fill(r[1],c)+'</div></div>'});
 if(s.f)h+='<div class="fig">'+F[s.f]()+'</div>';sec.innerHTML=h;root.appendChild(sec)});
function upd(){const a=document.querySelectorAll('.b,.sv'),s=document.querySelectorAll('.b.s,.sv.s');prog.textContent='表示中 '+s.length+' / '+a.length}
document.querySelectorAll('.b,.sv').forEach(b=>{let t;

 b.onclick=()=>{b.classList.toggle('s');upd()};b.ondblclick=ed;
 b.ontouchstart=()=>{t=setTimeout(ed,700)};b.ontouchend=b.ontouchmove=()=>clearTimeout(t)});
